name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: apps/api
      - run: npm test
        working-directory: apps/worker
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
